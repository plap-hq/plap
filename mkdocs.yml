site_name: plap Docs
site_description: Documentation for plap plugin authors
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Plugin Authors:
      - Overview: plugin-authors/index.md
      - Runtime Hooks: plugin-authors/hooks.md
      - State, Sides, and Persistence: plugin-authors/state.md
      - Getting Started: plugin-authors/getting-started.md
      - Built-in Plugin Patterns: plugin-authors/patterns.md
