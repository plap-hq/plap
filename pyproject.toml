[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "plap"
version = "0.1.0"
description = "plap"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "advanced-alchemy>=1.9.3,<2",
  "alembic>=1.18.4,<2",
  "anyio>=4.13.0,<5",
  "asyncpg>=0.31.0,<0.32",
  "blake3>=1.0.8,<2",
  "cachetools>=7.0.6,<8",
  "cashews>=7.5.0,<8",
  "cryptography>=47.0.0,<48",
  "fastmcp>=3.2.4,<4",
  "fireworks-ai>=0.19.20,<0.20",
  "jsonpatch>=1.33,<2",
  "jsonschema-rs>=0.46.5,<0.47",
  "litestar>=2.21.1,<3",
  "msgspec>=0.21.1,<0.22",
  "openai>=2.32.0,<3",
  "opentelemetry-api>=1.42.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
  "opentelemetry-instrumentation-aiohttp-client>=0.63b1,<0.64",
  "opentelemetry-instrumentation-asgi>=0.63b1,<0.64",
  "opentelemetry-instrumentation-httpx>=0.63b1,<0.64",
  "opentelemetry-instrumentation-logging>=0.63b1,<0.64",
  "opentelemetry-instrumentation-sqlalchemy>=0.63b1,<0.64",
  "opentelemetry-sdk>=1.42.1,<2",
  "pluggy>=1.6.0,<2",
  "pydantic>=2.13.3,<3",
  "pydantic-settings>=2.14.0,<3",
  "PyNaCl>=1.6.2,<2",
  "python-box>=7.4.1,<8",
  "sqlalchemy>=2.0.49,<3",
  "structlog>=25.5.0,<26",
  "svcs>=25.1.0,<26",
  "tenacity>=9.1.4,<10",
  "tiktoken>=0.12.0,<0.13",
  "transformers>=5.8.0,<6",
  "uvicorn[standard]>=0.46.0,<0.47",
  "zstandard>=0.25.0,<0.26",
]

[dependency-groups]
dev = [
  "datasets>=5.0.0,<6",
  "duckdb>=1.5.3,<2",
  "gepa[full]>=0.1.1,<0.2",
  "httpx>=0.28.1,<0.29",
  "hypothesis>=6.155.1,<7",
  "pre-commit>=4.6.0,<5",
  "pytest>=9.0.3,<10",
  "ruff>=0.15.11,<0.16",
  "testcontainers[postgres]>=4.14.2,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plap"]

[project.entry-points."plap.plugin"]
core = "plap.plugins.core"
easy = "plap.plugins.easy"
vision = "plap.plugins.vision"
summary = "plap.plugins.summary"
advisor = "plap.plugins.advisor"
chat_completions = "plap.plugins.chat_completions"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
anyio_mode = "auto"
filterwarnings = [
  "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
  "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning",
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16:DeprecationWarning:asyncio\\.threads",
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16:DeprecationWarning:litestar\\.concurrency",
  "ignore:remove second argument of ws_handler:DeprecationWarning",
  "ignore:Pydantic V1 style `@validator` validators are deprecated:pydantic.warnings.PydanticDeprecatedSince20:fireworks\\.client\\.image_api",
]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "money: live provider tests that spend API credits",
  "expensive: live provider tests with unusually high token or API cost",
]

[tool.ruff]
line-length = 140

[tool.ruff.per-file-target-version]
"scripts/pier/*.py" = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = ["RUF", "C4", "SIM", "RET", "PIE", "PERF", "TRY", "PTH", "PLW", "PLC", "PLR1714", "N"]
ignore = ["E731", "PLW0108", "TRY003"]

[tool.alembic]
script_location = "%(here)s/migrations"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
exclude-newer = "7d"

[tool.pixi.dependencies]
cue = ">=0.16.1,<0.17"
python = "3.14.*"

[tool.pixi.pypi-dependencies]
plap = { path = ".", editable = true }

[tool.pixi.pypi-options.dependency-overrides]
ruff = ">=0.15.11,<0.16"

[tool.pixi.environments]
default = ["dev"]

[tool.pixi.tasks]
setup = "pre-commit install --install-hooks"
dev = "python scripts/dev.py"
db-current = "alembic -c pyproject.toml current"
db-history = "alembic -c pyproject.toml history"
db-upgrade = "alembic -c pyproject.toml upgrade head"
